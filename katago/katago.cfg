# KataGo configuration for the WeiqiGo bot.
# Chinese rules + area scoring + positional superko, matching the server.
rules = chinese

# Quiet logs (keep them inside the katago folder).
logDir = ./katago/log
logAllGTPCommunication = false
logSearchInfo = false
logToStderr = false

# Number of CPU search threads (OpenCL/Eigen backend). Raise for more speed.
numSearchThreads = 4
